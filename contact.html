<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聯絡我們</title>
  <style>
    body { font-family: sans-serif; margin: 20px; line-height: 1.6; }
    nav a { margin-right: 10px; }
    form div { margin-bottom: 12px; }
    label { display: block; font-weight: bold; }
    input, textarea { width: 100%; max-width: 400px; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 20px; cursor: pointer; background-color: #007bff; color: white; border: none; }
  </style>
</head>
<body>

  <!-- 選單導覽 -->
  <nav>
    <a href="index.html">首頁</a> | 
    <a href="about.html">公司介紹</a> | 
    <a href="contact.html">聯絡我們</a>
  </nav>

  <h1>聯絡我們</h1>

  <!-- 使用 action 直連 Google Apps Script 部署網址 -->
  <form action="https://script.google.com/macros/s/AKfycbxkXNvcP4UALZ0T-R-EFWbawueVFZibseu0AuFr910T2lu5T1YczkImEH-sF4DE-S6e-w/exec" method="POST">
    <div>
      <label for="name">姓名：</label>
      <input type="text" id="name" name="name" required>
    </div>
    
    <div>
      <label for="phone">電話：</label>
      <input type="tel" id="phone" name="phone" required>
    </div>
    
    <div>
      <label for="email">EMAIL：</label>
      <input type="email" id="email" name="email" required>
    </div>
    
    <div>
      <label for="message">聯絡內容：</label>
      <textarea id="message" name="message" rows="5" required></textarea>
    </div>
    
    <button type="submit">送出表單</button>
  </form>

</body>
</html>
