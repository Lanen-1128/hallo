<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>聯絡我們</title>
</head>
<body>
  <nav>
    <a href="index.html">首頁</a> | 
    <a href="about.html">公司介紹</a> | 
    <a href="contact.html">聯絡我們</a>
  </nav>

  <h1>聯絡我們</h1>

  <form id="contactForm">
    <div>
      <label for="name">姓名：</label><br>
      <input type="text" id="name" name="name" required>
    </div>
    <br>
    <div>
      <label for="phone">電話：</label><br>
      <input type="tel" id="phone" name="phone" required>
    </div>
    <br>
    <div>
      <label for="email">EMAIL：</label><br>
      <input type="email" id="email" name="email" required>
    </div>
    <br>
    <div>
      <label for="message">聯絡內容：</label><br>
      <textarea id="message" name="message" rows="5" required></textarea>
    </div>
    <br>
    <button type="submit" id="submitBtn">送出表單</button>
  </form>

  <p id="responseMsg"></p>

  <script>
    // 已更新為你的新 Web App 網址
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwwAkeHjXgTFMkyVYwrNY1IlaUq7dx1wNeKbi8euB0N7Mjcli0NMzpImO2Lfu7JsSxl_w/exec';

    const form = document.getElementById('contactForm');
    const responseMsg = document.getElementById('responseMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      responseMsg.innerText = "資料傳送中，請稍候...";
      responseMsg.style.color = "blue";
      submitBtn.disabled = true;

      const formData = new URLSearchParams();
      formData.append('name', document.getElementById('name').value);
      formData.append('phone', document.getElementById('phone').value);
      formData.append('email', document.getElementById('email').value);
      formData.append('message', document.getElementById('message').value);

      fetch(scriptURL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: formData.toString()
      })
      .then(() => {
        responseMsg.innerText = "表單已成功送出！請至信箱查看收件匣（或垃圾郵件）。";
        responseMsg.style.color = "green";
        form.reset();
      })
      .catch(error => {
        console.error('Error!', error);
        responseMsg.innerText = "送出失敗，請確認網路連線。";
        responseMsg.style.color = "red";
      })
      .finally(() => {
        submitBtn.disabled = false;
      });
    });
  </script>
</body>
</html>
