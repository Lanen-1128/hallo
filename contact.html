<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>聯絡我們</title>
</head>
<body>
  <nav>
    <a href="index.html">首頁</a> | 
    <a href="about.html">公司介紹</a> | 
    <a href="contact.html">聯絡我們</a>
  </nav>

  <h1>聯絡我們</h1>

  <form id="contactForm">
    <div>
      <label for="name">姓名：</label><br>
      <input type="text" id="name" name="name" required>
    </div>
    <br>
    <div>
      <label for="phone">電話：</label><br>
      <input type="tel" id="phone" name="phone" required>
    </div>
    <br>
    <div>
      <label for="email">EMAIL：</label><br>
      <input type="email" id="email" name="email" required>
    </div>
    <br>
    <div>
      <label for="message">聯絡內容：</label><br>
      <textarea id="message" name="message" rows="5" required></textarea>
    </div>
    <br>
    <button type="submit">送出表單</button>
  </form>

  <p id="responseMsg"></p>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxkXNvcP4UALZ0T-R-EFWbawueVFZibseu0AuFr910T2lu5T1YczkImEH-sF4DE-S6e-w/exec';

    document.getElementById('contactForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const responseMsg = document.getElementById('responseMsg');
      responseMsg.innerText = "發送中，請稍候...";

      const data = {
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value
      };

      fetch(scriptURL, {
        method: 'POST',
        mode: 'no-cors', // 避開跨網域問題
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(data)
      })
      .then(() => {
        responseMsg.innerText = "表單已成功送出！請檢查你的信箱。";
        document.getElementById('contactForm').reset();
      })
      .catch(error => {
        console.error('Error!', error.message);
        responseMsg.innerText = "送出失敗，請重試。";
      });
    });
  </script>
</body>
</html>
